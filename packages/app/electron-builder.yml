appId: io.github.eriksimonic.mongogui
productName: Mongo GUI
executableName: mongo-gui
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# No native modules: SQLite, AES and scrypt come from Node 24, so there is nothing to rebuild.
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: eriksimonic
  repo: mongodb-mager
  # electron-builder creates the GitHub release published (not draft) on first upload.
  releaseType: release
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: false
  identity: null
