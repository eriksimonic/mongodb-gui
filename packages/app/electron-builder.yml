appId: io.github.eriksimonic.mongogui
productName: Mongo GUI
executableName: mongo-gui
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# No native modules: SQLite, AES and scrypt come from Node 24, so there is nothing to rebuild.
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Packaged package.json name. The package is @mongo-gui/app, and electron-builder derives the
# updater cache directory from this name. productName still sets userData.
extraMetadata:
  name: mongo-gui
publish:
  provider: github
  owner: eriksimonic
  repo: mongodb-gui
  # The release starts as a draft. The publish job in release.yml marks it public once all
  # platforms have uploaded, so users never see a partial release.
  releaseType: draft
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  syncDesktopName: true
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  # Ad-hoc signing ('-') keeps the Electron signature valid on Apple Silicon without a
  # certificate. Without it, macOS reports the app as damaged.
  hardenedRuntime: false
  identity: '-'
