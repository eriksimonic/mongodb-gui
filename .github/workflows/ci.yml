name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The github-actions reporter turns failing tests into annotations, which are readable
      # without downloading the job log.
      - name: Unit tests
        run: pnpm exec vitest run --project unit --reporter=default --reporter=github-actions

      - name: Check formatting
        run: pnpm format:check

  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Electron is the browser under test, so Playwright's own browsers are not needed.
      # The MongoDB container runs through Docker, which ubuntu runners provide.
      # Optional: with DOCKERHUB_USERNAME and DOCKERHUB_TOKEN set as repository secrets the
      # runner logs in to Docker Hub, which lifts the anonymous pull limit entirely.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # Mirrors rate-limit anonymous pulls now and then, so pull the test image up front with
      # retries instead of letting the first test fail on it.
      - name: Pull the test image
        run: |
          for attempt in 1 2 3 4; do
            docker pull public.ecr.aws/docker/library/mongo:8.0.17 && exit 0
            echo "pull attempt $attempt failed, retrying in 30 s"
            sleep 30
          done
          exit 1

      # GitHub's shared runners hit Docker Hub's anonymous pull limit. Testcontainers pulls
      # the same official images from the AWS public mirror of the Docker library instead.
      - name: Run end-to-end tests
        run: xvfb-run -a pnpm test:e2e
        env:
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: public.ecr.aws/docker/library/
          # The ryuk cleanup helper lives only on Docker Hub; the runner discards containers anyway.
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Upload e2e output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: e2e/output
          if-no-files-found: ignore

  # One job per package, so a failure names the package and each job pulls only its images.
  integration:
    name: integration (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # MONGO_IMAGES in packages/mongo-adapter/src/test/mongo-container.ts.
          - package: mongo-adapter
            images: mongo:4.4 mongo:6.0 mongo:8.0.17
          - package: app
            images: mongo:8.0.17
          - package: shell-runtime
            images: mongo:6.0 mongo:8.0.17
          # The forwarder suite starts FORWARDER_IMAGE from packages/docker/src/forwarder.ts.
          - package: docker
            images: mongo:8.0.17 alpine/socat:1.8.1.3
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Optional, as in the e2e job: the Docker Hub login lifts the anonymous pull limit.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # Testcontainers pulls an image only when it is missing, so once these pulls succeed the
      # tests never contact a registry. Concurrent pulls from parallel test files ran into
      # "429 Too Many Requests" from the ECR mirror in a local run; one pull per image with
      # retries avoids that. Library images (mongo) come through the same mirror prefix that
      # Testcontainers adds. alpine/socat is not a library image, so it comes from Docker Hub.
      - name: Pull the test images
        run: |
          pull() {
            for attempt in 1 2 3 4 5; do
              docker pull "$1" && return 0
              echo "pull of $1 attempt $attempt failed, retrying in $((attempt * 20)) s"
              sleep $((attempt * 20))
            done
            return 1
          }
          for image in ${{ matrix.images }}; do
            case "$image" in
              */*) pull "$image" || exit 1 ;;
              *) pull "public.ecr.aws/docker/library/$image" || exit 1 ;;
            esac
          done

      # vitest.config.ts runs integration files one at a time when CI is set. The unlimited stack
      # matches local runs. tsc and vite have segfaulted under the default 8 MB stack on Linux.
      - name: Run integration tests
        run: |
          ulimit -s unlimited
          pnpm test:integration packages/${{ matrix.package }}/ --reporter=default --reporter=github-actions
        env:
          # Same mirror and ryuk settings as the e2e job. See the comments there.
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: public.ecr.aws/docker/library/
          TESTCONTAINERS_RYUK_DISABLED: 'true'
