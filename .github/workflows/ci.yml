name: CI

on:
  push:
    branches: [main, architecture-redesign]
  pull_request:
    branches: [main]

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The github-actions reporter turns failing tests into annotations, which are readable
      # without downloading the job log. The JSON report holds every test with its error and
      # duration, and is uploaded when the step fails.
      - name: Unit tests
        run: pnpm exec vitest run --project unit --reporter=default --reporter=github-actions --reporter=json --outputFile.json=vitest-report.json

      - name: Upload the unit test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-${{ matrix.os }}
          path: vitest-report.json
          if-no-files-found: ignore

      - name: Check formatting
        run: pnpm format:check

  # Builds the app once. The e2e and wiring jobs download this output instead of building again.
  build:
    name: build (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        run: pnpm build

      # Short retention, the output is only needed within this run.
      - name: Upload the app build
        uses: actions/upload-artifact@v7
        with:
          name: app-out
          path: packages/app/out
          retention-days: 1

  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [check, build]
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build job already built the app. Reuse its output instead of building again.
      - name: Download the app build
        uses: actions/download-artifact@v7
        with:
          name: app-out
          path: packages/app/out

      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Electron is the browser under test, so Playwright's own browsers are not needed.
      # The MongoDB container runs through Docker, which ubuntu runners provide.
      # Optional: with DOCKERHUB_USERNAME and DOCKERHUB_TOKEN set as repository secrets the
      # runner logs in to Docker Hub, which lifts the anonymous pull limit entirely.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # Mirrors rate-limit anonymous pulls now and then, so pull the test image up front with
      # retries instead of letting the first test fail on it.
      - name: Pull the test image
        run: |
          for attempt in 1 2 3 4; do
            docker pull public.ecr.aws/docker/library/mongo:8.0.17 && exit 0
            echo "pull attempt $attempt failed, retrying in 30 s"
            sleep 30
          done
          exit 1

      # GitHub's shared runners hit Docker Hub's anonymous pull limit. Testcontainers pulls
      # the same official images from the AWS public mirror of the Docker library instead.
      - name: Run end-to-end tests
        run: xvfb-run -a pnpm test:e2e
        env:
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: public.ecr.aws/docker/library/
          # The ryuk cleanup helper lives only on Docker Hub; the runner discards containers anyway.
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          # Skips the build inside global setup. The build job already built the app.
          E2E_PREBUILT: '1'

      - name: Upload e2e output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: e2e/output
          if-no-files-found: ignore

  # The e2e specs on Windows and macOS, against a native mongod because those runners have no Docker.
  platform:
    name: platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build job already built the app. Reuse its output instead of building again.
      - name: Download the app build
        uses: actions/download-artifact@v7
        with:
          name: app-out
          path: packages/app/out

      - name: Install mongod on Windows
        if: ${{ runner.os == 'Windows' }}
        run: choco install mongodb --no-progress -y

      - name: Install mongod on macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew tap mongodb/brew
          brew install mongodb-community

      # Starts mongod in the background on the default port and waits until it accepts connections.
      # The Windows package puts mongod.exe under Program Files without adding it to PATH.
      - name: Start mongod
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            MONGOD=$(ls /c/Program\ Files/MongoDB/Server/*/bin/mongod.exe | tail -n 1)
          else
            MONGOD=$(command -v mongod)
          fi
          echo "using $MONGOD"
          mkdir -p "$RUNNER_TEMP/mongo-data"
          nohup "$MONGOD" --dbpath "$RUNNER_TEMP/mongo-data" --bind_ip 127.0.0.1 --port 27017 > "$RUNNER_TEMP/mongod.log" 2>&1 &
          for attempt in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/mongod.log"
          exit 1

      # No display setup: Windows and macOS runners have a desktop session.
      - name: Run end-to-end tests
        run: pnpm test:e2e
        env:
          # Skips the build inside global setup. The build job already built the app.
          E2E_PREBUILT: '1'
          E2E_MONGO_URI: mongodb://127.0.0.1:27017

      - name: Upload e2e output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: platform-output-${{ matrix.os }}
          path: e2e/output
          if-no-files-found: ignore

  # One job per package, so a failure names the package and each job pulls only its images.
  integration:
    name: integration (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # MONGO_IMAGES in packages/mongo-adapter/src/test/mongo-container.ts.
          - package: mongo-adapter
            images: mongo:4.4 mongo:6.0 mongo:8.0.17
          - package: app
            images: mongo:8.0.17
          - package: shell-runtime
            images: mongo:6.0 mongo:8.0.17
          # The forwarder suite starts FORWARDER_IMAGE from packages/docker/src/forwarder.ts.
          - package: docker
            images: mongo:8.0.17 alpine/socat:1.8.1.3
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app integration tests run the bundled mongodump and mongorestore.
      - name: Cache the MongoDB tools archive
        if: ${{ matrix.package == 'app' }}
        uses: actions/cache@v5
        with:
          path: packages/app/.cache/mongo-tools
          key: mongo-tools-${{ runner.os }}-${{ hashFiles('packages/app/mongo-tools.json') }}

      - name: Fetch the MongoDB tools
        if: ${{ matrix.package == 'app' }}
        run: pnpm --filter @mongo-gui/app fetch:mongo-tools

      # Optional, as in the e2e job: the Docker Hub login lifts the anonymous pull limit.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # Testcontainers pulls an image only when it is missing, so once these pulls succeed the
      # tests never contact a registry. Concurrent pulls from parallel test files ran into
      # "429 Too Many Requests" from the ECR mirror in a local run; one pull per image with
      # retries avoids that. Library images (mongo) come through the same mirror prefix that
      # Testcontainers adds. alpine/socat is not a library image, so it comes from Docker Hub.
      - name: Pull the test images
        run: |
          pull() {
            for attempt in 1 2 3 4 5; do
              docker pull "$1" && return 0
              echo "pull of $1 attempt $attempt failed, retrying in $((attempt * 20)) s"
              sleep $((attempt * 20))
            done
            return 1
          }
          for image in ${{ matrix.images }}; do
            case "$image" in
              */*) pull "$image" || exit 1 ;;
              *) pull "public.ecr.aws/docker/library/$image" || exit 1 ;;
            esac
          done

      # vitest.config.ts runs integration files one at a time when CI is set. The unlimited stack
      # matches local runs. tsc and vite have segfaulted under the default 8 MB stack on Linux.
      - name: Run integration tests
        run: |
          ulimit -s unlimited
          pnpm test:integration packages/${{ matrix.package }}/ --reporter=default --reporter=github-actions
        env:
          # Same mirror and ryuk settings as the e2e job. See the comments there.
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: public.ecr.aws/docker/library/
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  # Browser journeys against the built app and an in-process router. See docs/e2e-test-strategy.md.
  wiring:
    name: wiring (${{ matrix.segment }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    # See "Stability rules" in docs/e2e-test-strategy.md.
    strategy:
      fail-fast: false
      matrix:
        # Each segment has its own Compose stack, trace file and artifact.
        segment: [standalone, replset, docker]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build job already built the app. Reuse its output instead of building again.
      - name: Download the app build
        uses: actions/download-artifact@v7
        with:
          name: app-out
          path: packages/app/out

      # The backup and restore journeys run the bundled mongodump and mongorestore.
      - name: Cache the MongoDB tools archive
        if: ${{ matrix.segment == 'standalone' }}
        uses: actions/cache@v5
        with:
          path: packages/app/.cache/mongo-tools
          key: mongo-tools-${{ runner.os }}-${{ hashFiles('packages/app/mongo-tools.json') }}

      - name: Fetch the MongoDB tools
        if: ${{ matrix.segment == 'standalone' }}
        run: pnpm --filter @mongo-gui/app fetch:mongo-tools

      # Optional, as in the e2e job: the Docker Hub login lifts the anonymous pull limit.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # Same retry loop as the e2e job. The Compose stack pulls this image by name.
      - name: Pull the test image
        run: |
          for attempt in 1 2 3 4; do
            docker pull public.ecr.aws/docker/library/mongo:8.0.17 && exit 0
            echo "pull attempt $attempt failed, retrying in 30 s"
            sleep 30
          done
          exit 1

      # The docker segment starts the forwarder image. It is not a library image, so it comes
      # from Docker Hub, not the mirror.
      - name: Pull the forwarder image
        if: ${{ matrix.segment == 'docker' }}
        run: |
          for attempt in 1 2 3 4; do
            docker pull alpine/socat:1.8.1.3 && exit 0
            echo "pull attempt $attempt failed, retrying in 30 s"
            sleep 30
          done
          exit 1

      # Chrome is preinstalled on ubuntu runners, so the wiring tests need no virtual display.
      # The trace file gets one line per RPC call. Its folder must exist before the run.
      - name: Run wiring tests
        run: |
          mkdir -p e2e/output/traces
          pnpm test:wiring
        env:
          E2E_PREBUILT: '1'
          E2E_SEGMENT: ${{ matrix.segment }}
          MONGO_IMAGE: public.ecr.aws/docker/library/mongo:8.0.17
          MONGO_GUI_RPC_TRACE: ${{ github.workspace }}/e2e/output/traces/${{ matrix.segment }}.jsonl

      # Uploaded even on success, so the coverage job can merge the traces from every segment.
      - name: Upload the traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trace-${{ matrix.segment }}
          path: e2e/output/traces
          if-no-files-found: ignore

      - name: Upload wiring output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wiring-output-${{ matrix.segment }}
          path: e2e/output
          if-no-files-found: ignore

  # Merges the traces from all wiring segments and fails when a mapped RPC method was never called.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: wiring
    if: always()
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The coverage script imports nothing outside e2e, so it runs without installing packages.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the traces
        uses: actions/download-artifact@v7
        with:
          pattern: trace-*
          merge-multiple: true
          path: e2e/output/traces

      - name: Check RPC coverage
        run: node e2e/coverage-check.ts e2e/output/traces
