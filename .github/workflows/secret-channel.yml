name: Secret channel validation

# Checks that mongodump and mongorestore read --config from a named pipe on Windows and macOS.
# Linux is validated locally. GitHub cannot dispatch a workflow that only exists on a branch, so
# it runs on a push to this branch. Rerun it from the Actions tab or with gh run rerun.
on:
  push:
    branches: [ci/secret-channel-validation]
  workflow_dispatch:

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install mongod on Windows
        if: ${{ runner.os == 'Windows' }}
        run: choco install mongodb --no-progress -y

      - name: Install mongod and the database tools on macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew tap mongodb/brew
          brew trust mongodb/brew
          brew install mongodb-community mongodb-database-tools

      # The tools version and URL come from the app manifest, so the test runs the shipped build.
      - name: Download the database tools on Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          url=$(node -p "require('./packages/app/mongo-tools.json').targets['win32-x64'].url")
          curl -fsSL "$url" -o "$RUNNER_TEMP/tools.zip"
          7z x "$RUNNER_TEMP/tools.zip" -o"$RUNNER_TEMP/tools" -y > /dev/null
          bin=$(dirname "$(find "$RUNNER_TEMP/tools" -name mongodump.exe | head -n 1)")
          echo "TOOLS_BIN=$bin" >> "$GITHUB_ENV"

      - name: Start mongod
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            MONGOD=$(ls /c/Program\ Files/MongoDB/Server/*/bin/mongod.exe | tail -n 1)
          else
            MONGOD=$(command -v mongod)
          fi
          mkdir -p "$RUNNER_TEMP/mongo-data"
          nohup "$MONGOD" --dbpath "$RUNNER_TEMP/mongo-data" --bind_ip 127.0.0.1 --port 27017 > "$RUNNER_TEMP/mongod.log" 2>&1 &
          for attempt in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/mongod.log"
          exit 1

      - name: Validate the secret channel
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            dump="$TOOLS_BIN/mongodump.exe"
            restore="$TOOLS_BIN/mongorestore.exe"
          else
            dump=$(command -v mongodump)
            restore=$(command -v mongorestore)
          fi
          "$dump" --version
          node scripts/secret-channel/validate.mjs "$dump" "$restore" mongodb://127.0.0.1:27017
