name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # One job at a time. electron-builder creates the release on the first upload and
    # attaches later uploads to it only while it is less than two hours old. Parallel
    # jobs can race to create the release, and the losing job then fails.
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Build and publish installers
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm --filter @mongo-gui/app dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installers without publishing
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm --filter @mongo-gui/app dist

      - name: Upload installers for inspection
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: packages/app/release/*.*
          if-no-files-found: error
