name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: prepare draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check that the tag matches the app version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./packages/app/package.json').version")"

      - name: Create the draft release if it does not exist
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  build:
    name: build (${{ matrix.os }})
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # The prepare job creates the draft first, so every build finds it and none races to create it.
    # fail-fast is off so that one failing platform leaves the other platforms' files in
    # the draft release for inspection. The publish job still waits for all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Cache the MongoDB tools archive
        uses: actions/cache@v5
        with:
          path: packages/app/.cache/mongo-tools
          key: mongo-tools-${{ runner.os }}-${{ hashFiles('packages/app/mongo-tools.json') }}

      - name: Build and publish installers to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm --filter @mongo-gui/app dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installers without publishing
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm --filter @mongo-gui/app dist

      # Checks that execute bits and placement survived packaging. macOS bundles no tools.
      - name: Run the packaged mongodump
        if: ${{ runner.os != 'macOS' }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            packages/app/release/win-unpacked/resources/mongo-tools/bin/mongodump.exe --version
          else
            packages/app/release/linux-unpacked/resources/mongo-tools/bin/mongodump --version
          fi

      # Starts the unpacked app and checks that it reaches the master password prompt.
      # Both build steps leave the unpacked directory behind. out/ is already built by dist.
      - name: Run the packaged app smoke test
        shell: bash
        env:
          E2E_NO_MONGO: '1'
          E2E_PREBUILT: '1'
        run: |
          release=packages/app/release
          case "$RUNNER_OS" in
            Windows) exe="$release/win-unpacked/Mongo GUI.exe" ;;
            Linux) exe="$release/linux-unpacked/mongo-gui" ;;
            macOS)
              exe=
              for dir in "$release"/mac-arm64 "$release"/mac; do
                if [ -d "$dir/Mongo GUI.app" ]; then
                  exe="$dir/Mongo GUI.app/Contents/MacOS/Mongo GUI"
                  break
                fi
              done
              if [ -z "$exe" ]; then
                echo "::error::No 'Mongo GUI.app' under $release/mac-arm64 or $release/mac. Found:"
                ls "$release"
                exit 1
              fi
              ;;
          esac
          if [ ! -f "$exe" ]; then
            echo "::error::Packaged app not found at $exe"
            ls "$release"
            exit 1
          fi
          # Node resolves a native absolute path, which Git Bash's /d/a/... form is not.
          E2E_PACKAGED_EXECUTABLE="$(node -p "require('path').resolve(process.argv[1])" "$exe")"
          export E2E_PACKAGED_EXECUTABLE
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm exec playwright test -c e2e/playwright.config.ts persistence.spec.ts
          else
            pnpm exec playwright test -c e2e/playwright.config.ts persistence.spec.ts
          fi

      - name: Upload installers for inspection
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            packages/app/release/*.AppImage
            packages/app/release/*.deb
            packages/app/release/*.exe
            packages/app/release/*.dmg
            packages/app/release/*.zip
            packages/app/release/*.blockmap
            packages/app/release/latest*.yml

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Mark the release as public
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
